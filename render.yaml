# Render Static Site configuration
# https://render.com/docs/yaml-spec
#
# The repository root is published as-is. Pages are generated by
# `npm run build` and committed, so no build command runs on Render.

services:
  - type: web
    name: coastline-digital
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # If analytics are enabled in src/site.mjs, add the provider's script and
      # connect domains (for example https://plausible.io) to script-src and
      # connect-src below.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'self' https://formsubmit.co; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
      # CSS and JS URLs carry a content hash (?v=...), so they can be cached forever.
      - path: "*.css"
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: "*.js"
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: "*.woff2"
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Ensure /privacy works as /privacy/
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      # November 2026 redesign: websites and apps merged into custom software
      - type: redirect
        source: /services/websites-apps
        destination: /services/custom-software-development/
      - type: redirect
        source: /services/websites-apps/*
        destination: /services/custom-software-development/
      # Illustrative examples replaced by solution concepts
      - type: redirect
        source: /examples
        destination: /solutions/
      - type: redirect
        source: /examples/*
        destination: /solutions/
      # Old service URLs from before the October 2026 repositioning
      - type: redirect
        source: /services/local-websites
        destination: /services/custom-software-development/
      - type: redirect
        source: /services/local-websites/*
        destination: /services/custom-software-development/
      - type: redirect
        source: /services/google-business
        destination: /services/custom-software-development/
      - type: redirect
        source: /services/google-business/*
        destination: /services/custom-software-development/
      # Listing video offer retired; send old links to the home page
      - type: redirect
        source: /services/listing-tour-video
        destination: /
      - type: redirect
        source: /services/listing-tour-video/*
        destination: /
