# Render Static Site configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: coastline-digital
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: "*.css"
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: "*.js"
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # 301 redirects: bare paths to trailing-slash for SEO signal consolidation
      # Same pattern as Clearline render.yaml. Slash URLs stay the canonical routes.
      - type: redirect
        source: /faq
        destination: /faq/
        status: 301
      - type: redirect
        source: /services/local-websites
        destination: /services/local-websites/
        status: 301
      - type: redirect
        source: /services/google-business
        destination: /services/google-business/
        status: 301
      - type: redirect
        source: /services/listing-tour-video
        destination: /services/listing-tour-video/
        status: 301
      - type: redirect
        source: /privacy
        destination: /privacy/
        status: 301
